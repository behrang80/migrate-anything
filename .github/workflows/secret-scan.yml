# Scans every commit of the repository for secrets.
#
# The scan in ci.yml runs on each push and looks only at the commits of that push. Started by
# hand or by the schedule, the same action scans the whole history instead, so this workflow is
# the complete check: run it before a release, and it repeats weekly.
name: Secret scan (full history)
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scanning (all commits)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
