# cargo-deny configuration. The project itself is Apache-2.0 (see LICENSE); this allowlist names the
# licenses its dependencies may carry. All of them are permissive and compatible with Apache-2.0.
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "BSL-1.0", "Unlicense"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path without a version. None of them is published
# (`publish = false`), so that is not a wildcard in the sense this check is meant to catch.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
