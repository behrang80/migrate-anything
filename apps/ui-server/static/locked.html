<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Migrate Anything Studio — open from your terminal</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main id="main" style="max-width: 720px; padding-top: 12vh">
      <div class="panel stack">
        <h1><span class="glow">This window is locked</span></h1>
        <p class="dim">
          Migrate Anything Studio only talks to the browser window it opened itself. Go to the terminal where it is running
          and open the link printed there (it starts with <code>http://127.0.0.1</code> and ends with a one-time key).
        </p>
        <p class="dim">Not running? Start it with:</p>
        <div class="cmd"><code>migrate-anything</code></div>
      </div>
    </main>
  </body>
</html>
