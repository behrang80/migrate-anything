[package]
name = "ma-bench"
description = "Benchmark suite for Migrate Anything (run in release mode)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ma-bench"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
ma-core = { workspace = true, features = ["test-approval"] }
ma-mapping.workspace = true
ma-types.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[lints]
workspace = true
