[package]
name = "migrate-anything"
description = "Migrate Anything command-line interface, MCP server entry point and job worker."
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "migrate-anything"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ma-core.workspace = true
ma-mcp.workspace = true
ma-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
ma-core = { workspace = true, features = ["test-approval"] }
ma-example-api.workspace = true
ma-connector-files.workspace = true
ma-sandbox.workspace = true
ma-security.workspace = true
sqlx = { workspace = true, features = ["postgres", "sqlite", "tls-rustls-ring"] }
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true
